<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#062849" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary SEO -->
    <title>Sarth CRM — Grow Business Faster | Leads, Inventory & Payments</title>
    <meta name="description" content="Sarth is an all-in-one CRM — capture leads from WhatsApp, Google Sheets & webhooks, manage follow-ups, quotations, payments and multi-warehouse inventory in one workspace." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sarth.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sarth CRM" />
    <meta property="og:title" content="Sarth CRM — Turn leads into revenue" />
    <meta property="og:description" content="Sarth is an all-in-one CRM — capture leads from WhatsApp, Google Sheets & webhooks, manage follow-ups, quotations, payments and multi-warehouse inventory in one workspace." />
    <meta property="og:url" content="https://sarth.app/" />
    <meta property="og:image" content="/sarth-logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sarth CRM — Turn leads into revenue" />
    <meta name="twitter:description" content="Sarth is an all-in-one CRM — capture leads from WhatsApp, Google Sheets & webhooks, manage follow-ups, quotations, payments and multi-warehouse inventory in one workspace." />
    <meta name="twitter:image" content="/sarth-logo.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sarth",
      "logo": "/sarth-logo.png"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Sarth CRM",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "999", "priceCurrency": "INR" },
      "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.8", "reviewCount": "127" }
    }
    </script>
</head>

<body class="hold-transition sidebar-mini layout-fixed layout-navbar-fixed">

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
